{% extends "sqladmin/base.html" %}
{% block body %}
<div class="d-flex align-items-center justify-content-center vh-100">
  <form class="col-lg-4 col-md-6 card card-md" action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
    <div class="card-body">
      <h2 class="card-title text-center mb-4">{{ admin.title }}</h2>
      {% if error %}<div class="alert alert-danger">Wrong or expired code, or this email isn't an admin.</div>{% endif %}
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <div class="input-group">
          <input id="email" name="email" type="email" class="form-control" placeholder="you@example.com" required>
          <button id="send" type="button" class="btn">Send code</button>
        </div>
        <small id="sent" class="form-hint"></small>
      </div>
      <div class="mb-3">
        <label class="form-label" for="code">6-digit code</label>
        <input id="code" name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" class="form-control" placeholder="123456" required>
      </div>
      <div class="form-footer">
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </div>
    </div>
  </form>
</div>
<script>
  document.getElementById('send').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const hint = document.getElementById('sent');
    if (!email) { hint.textContent = 'Enter your email first.'; return; }
    hint.textContent = 'Sending…';
    try {
      const r = await fetch('/auth/otp/request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
      const d = await r.json().catch(() => ({}));
      hint.textContent = r.ok ? 'Code sent. Check your email.' : (d.detail || 'Could not send the code.');
      if (r.ok) document.getElementById('code').focus();
    } catch (e) { hint.textContent = 'Could not reach the server.'; }
  });
</script>
{% endblock %}
