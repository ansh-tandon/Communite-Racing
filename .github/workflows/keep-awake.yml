name: Keep the API awake

# Render's free web service sleeps after 15 minutes without a request, and the next visitor waits ~30-60 s.
# This calls the API's /health (no database query) every 5 minutes so it stays awake. One always-on service
# fits Render's 750 free hours a month, and Actions minutes are free on a public repo.
# GitHub can run scheduled jobs a few minutes late; every 5 minutes leaves room for that.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # run it by hand from the Actions tab

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Call /health
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 https://api.communitieracing.in/health; then
              echo; echo "API awake (attempt $attempt)"; exit 0
            fi
            sleep 15
          done
          # a warning rather than a failure, so a brief Render blip doesn't send failure emails
          echo "::warning::The API did not answer /health after 3 tries"
